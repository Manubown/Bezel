# Publishes the site and the app to GitHub Pages on every push to master, and whenever the `stable` tag moves
# (spec D16 of .scratch/outside-view):
#   https://manubown.github.io/Bezel/          the site (apps/site), at brand.json's address
#   https://manubown.github.io/Bezel/play/     the app for everyone: the commit the `stable` tag points at, built from
#                                              its own tree (master while there is no tag)
#   https://manubown.github.io/Bezel/next/     the app as on master, for the makers
#   https://manubown.github.io/Bezel/stable/   forwards to play/ with its query: old links, QR codes and icons
#   https://manubown.github.io/Bezel/?room=…   forwards to next/ with its query: the QR of a first phone still on a
#                                              build from before the move; the root opened from an installed icon
#                                              forwards to play/
# One upload, so the site and both app builds cannot drift apart. `pnpm pages` builds and checks the same into
# apps/site/dist; `pnpm stable <ref>` moves the tag.
name: pages

on:
  push:
    branches: [master]
    tags: [stable]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Astro needs 22.23.4 or newer; the runner's cached 22 may be older.
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The site (with `astro check`), both app builds, the forwards; fails on a link that does not resolve or a
      # forward that drops its query (scripts/pages.mjs).
      - run: pnpm pages
        env:
          # The TURN relay's ICE servers as a JSON array (`apps/pwa/src/turn.ts`), in both app builds; unset = no
          # relay. `pnpm setup-turn` sets it.
          VITE_MGC_TURN_SERVERS: ${{ secrets.MGC_TURN_SERVERS }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
