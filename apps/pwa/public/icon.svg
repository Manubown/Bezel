  <g fill="none" stroke="#f2f0ea" stroke-width="24">
    <rect x="114" y="150" width="108" height="212" rx="18"/>
    <rect x="290" y="150" width="108" height="212" rx="18"/>
  </g>
  <circle cx="256" cy="256" r="44" fill="#121212"/>
  <circle cx="256" cy="256" r="30" fill="#f2f0ea"/>
</svg>
