<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- A shared link's picture (og:image): three phones in a row on a dark table, a Pong ball crossing the gap between two of them.
       No words in it, so the name stays in brand.json alone. Source of preview.png, rasterised once with headless Chrome (no build step). -->
  <defs>
    <radialGradient id="table" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1e1e20"/>
      <stop offset="1" stop-color="#09090a"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="phone">
      <rect width="250" height="500" rx="40" fill="#050505" stroke="#3a3a3c" stroke-width="2"/>
      <rect x="9" y="9" width="232" height="482" rx="31" fill="#0b0b0c"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="url(#table)"/>
  <g filter="url(#lift)">
    <use href="#phone" x="197" y="65"/>
    <use href="#phone" x="475" y="65"/>
    <use href="#phone" x="753" y="65"/>
  </g>
  <!-- The net, across the middle phone. -->
  <line x1="600" y1="96" x2="600" y2="534" stroke="#f2f0ea" stroke-opacity="0.22" stroke-width="4" stroke-dasharray="16 14"/>
  <!-- The Players' paddles: coral on the first phone, teal on the last. -->
  <rect x="228" y="346" width="14" height="96" rx="7" fill="#ff6b4a"/>
  <rect x="958" y="170" width="14" height="96" rx="7" fill="#2ec4b6"/>
  <!-- The ball, coming off the coral paddle, halfway across the first gap, with a short trail. -->
  <g fill="#f2f0ea">
    <circle cx="333" cy="345" r="7" fill-opacity="0.08"/>
    <circle cx="365" cy="334" r="9" fill-opacity="0.16"/>
    <circle cx="397" cy="322" r="11" fill-opacity="0.26"/>
    <circle cx="429" cy="311" r="13" fill-opacity="0.4"/>
    <circle cx="461" cy="300" r="16" filter="url(#glow)" fill-opacity="0.5"/>
    <circle cx="461" cy="300" r="15"/>
  </g>
</svg>
