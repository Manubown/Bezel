<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="%GROUND%" />
    <!-- Relative: the build writes the manifest from brand.json (brand.ts), it is no file in public/ that Vite would give the base. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%BRAND_NAME%</title>
    <meta name="description" content="%BRAND_PITCH%" />
    <!-- A shared link's preview. The picture holds no name, so brand.json stays the one place that spells it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME%" />
    <meta property="og:description" content="%BRAND_PITCH%" />
    <meta property="og:url" content="%BRAND_URL%" />
    <meta property="og:image" content="%BRAND_URL%preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three phones lie in a row on a dark table; a ball crosses the gap between two of them." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #121212;
        --fg: #f2f0ea;
        --fg-2: #a8a59c;
        --line: #2a2a2a;
        --raise: #1b1b1b;
        --ok: #5bc46a;
        --wait: #e0b94a;
        --off: #5a5a5a;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      /* No scrolling, rubber-banding or pull-to-refresh on the page itself: a drag is always the Game's (or the sheet's, which re-enables panning below). */
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      ::selection { background: var(--ok); color: var(--bg); }
      :focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
      [hidden] { display: none !important; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* A running Match: the SDK fills it; opaque so the lobby preview never shows through. */
      #game { position: fixed; inset: 0; background: var(--bg); }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      .code { font-weight: 600; font-size: 20px; letter-spacing: 0.18em; }
      /* The public name (brand.json): first on the first phone's bar and on a joined phone's strip. */
      .brand { font-weight: 700; font-size: 17px; letter-spacing: 0.02em; }
      .dot { vertical-align: 0; margin-right: 2px; }
      .dot-ok { fill: var(--ok); }
      .dot-wait { fill: var(--wait); }
      .dot-off { fill: var(--off); }

      /* Before the script opens the HUD: the name, the pitch and a sign of life, so the page is never black. */
      .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; background: var(--bg); text-align: center; }
      .splash-name { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.1; }
      .splash-pitch { margin: 0; max-width: 24ch; color: var(--fg-2); font-size: 17px; text-wrap: balance; }
      .splash-dot { width: 12px; height: 12px; margin-top: 22px; border-radius: 50%; background: var(--fg); animation: alive 900ms ease-in-out infinite alternate; }
      @keyframes alive { from { opacity: 0.2; transform: scale(0.7); } }

      /* Host: bottom sheet. Collapsed it is one bar so the tile stays visible. */
      .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 100dvh; display: flex; flex-direction: column; background: var(--raise); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45); padding-bottom: env(safe-area-inset-bottom, 0); transition: transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      .sheet .bar { display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: baseline; width: 100%; padding: 14px 16px; text-align: left; flex: none; }
      /* While the Host's Tile shows a Game the folded bar is a small pill in a corner, so the Tile stays the Game's. */
      .sheet[data-playing]:not([data-open]) { left: auto; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0)); border: 1px solid var(--line); border-radius: 999px; box-shadow: none; padding-bottom: 0; opacity: 0.7; }
      .sheet[data-playing]:not([data-open]) .bar { display: flex; gap: 6px; padding: 5px 10px; font-size: 12px; }
      .sheet[data-playing]:not([data-open]) .brand, .sheet[data-playing]:not([data-open]) .code, .sheet[data-playing]:not([data-open]) .bar-meta, .sheet[data-playing]:not([data-open]) .bar-log { display: none; }
      .sheet .bar-meta { color: var(--fg-2); }
      .sheet .bar-action { color: var(--ok); font-weight: 500; }
      /* The sheet's body scrolls on its own when the phone is shorter than the sheet (QR, Games, roster). */
      .sheet .body { display: none; padding: 0 16px 16px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; min-height: 0; }
      /* `max-content` rows: a body shorter than its content (it scrolls) must not shrink the Game and arrangement rows (overflow items have a 0 minimum). */
      .sheet[data-open] .body { display: grid; grid-auto-rows: max-content; gap: 16px; align-content: start; }
      .join { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
      .qr { background: var(--fg); padding: 8px; border-radius: 6px; line-height: 0; }
      .qr canvas { display: block; }
      .hint { margin: 0; color: var(--fg-2); max-width: 28ch; }
      .hint b { color: var(--fg); font-weight: 500; overflow-wrap: anywhere; }
      /* Join a different table, folded at the bottom of the first phone's sheet: the page reopens as a Peer; this table's own code is refused in words. */
      .other-table summary { width: fit-content; padding: 10px 0; color: var(--fg-2); cursor: pointer; }
      .enter { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .enter input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; min-width: 0; letter-spacing: 0.18em; text-transform: uppercase; }
      .enter input::placeholder { color: var(--fg-2); letter-spacing: normal; text-transform: none; }
      .enter button { padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; transition: background 120ms; }
      .enter button:active { background: var(--line); }
      @media (hover: hover) { .enter button:hover { background: var(--line); } }
      .other-refusal { margin: 8px 0 0; color: var(--wait); }
      .other-refusal:empty { display: none; }
      .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .seg button { padding: 10px 0; color: var(--fg-2); transition: background 120ms, color 120ms; }
      .seg button + button { border-left: 1px solid var(--line); }
      .seg button[aria-checked="true"] { background: var(--fg); color: var(--bg); font-weight: 500; }
      /* A card per Game: its name, how many play and how the phones lie. Two side by side; in Maker mode, every Game in rows of two. */
      .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .card { display: grid; gap: 2px; align-content: start; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; text-align: left; transition: border-color 120ms, background 120ms; }
      .card .card-name { font-weight: 600; }
      .card .card-line { color: var(--fg-2); font-size: 12px; }
      .card[aria-checked="true"] { border-color: var(--fg); background: var(--bg); box-shadow: inset 0 0 0 1px var(--fg); }
      .card:disabled { opacity: 0.45; cursor: default; }
      /* How to lay the phones: the roster under its label, phones in Tile order. */
      .lay { display: grid; gap: 6px; }
      .lay-label { margin: 0; }
      .roster { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
      .roster li { display: grid; grid-template-columns: 28px 1fr auto; column-gap: 10px; row-gap: 2px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      .roster li:first-child { border-top: 0; }
      .roster .n { grid-row: 1 / span 2; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: var(--line); font-weight: 600; }
      .roster .who { font-weight: 500; }
      .roster .meta { grid-row: 2; grid-column: 2; color: var(--fg-2); }
      .roster .sync { grid-row: 2; grid-column: 3; justify-self: end; color: var(--fg-2); }
      /* The Tile order: ◀ towards the first phone, ▶ towards the last. */
      .roster .order { grid-row: 1; grid-column: 3; justify-self: end; display: flex; gap: 6px; }
      .move { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--fg); transition: background 120ms; }
      .move svg { fill: currentColor; }
      .move:not(:disabled):active { background: var(--line); }
      @media (hover: hover) { .move:not(:disabled):hover { background: var(--line); } }
      .move:disabled { color: var(--off); cursor: default; }
      .roster .pending { color: var(--fg-2); }
      .seg button:disabled { opacity: 0.45; cursor: default; }
      /* Controllers: one chip per phone; a pressed chip is held in hand, out of the Layout. */
      .roles { display: grid; gap: 6px; }
      .roles-label { margin: 0; }
      .roles-label span { color: var(--fg-2); font-size: 12px; margin-left: 4px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--fg-2); transition: background 120ms, color 120ms; }
      .chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 500; }
      .chip:disabled { opacity: 0.45; cursor: default; }
      .players { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 28px 1fr auto auto; gap: 8px 10px; }
      /* One shared set of columns, so name fields line up whichever rows carry a seat or a Bot chip. */
      .players li { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; }
      .players .n { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: var(--line); font-weight: 600; font-size: 12px; }
      .players input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; }
      .players input:disabled { color: var(--fg-2); }
      .players .meta { color: var(--fg-2); }
      .players .empty { color: var(--fg-2); padding: 7px 0; }
      .go { display: grid; gap: 6px; }
      .go .start, .go .end { padding: 12px 0; border-radius: 8px; font-weight: 600; }
      .go .start { background: var(--ok); color: var(--bg); }
      .go .end { border: 1px solid var(--line); }
      .reason { margin: 0; color: var(--wait); min-height: 1.4em; }
      .reason:empty { display: none; }
      /* The last Match is news, not a warning. */
      .reason.last { color: var(--fg-2); }
      /* The session log: export (share sheet on phones, download elsewhere) and clear. */
      .diag { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: center; padding-top: 4px; border-top: 1px solid var(--line); }
      .diag button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--fg-2); }
      .diag-meta { color: var(--fg-2); font-size: 12px; text-align: right; }
      /* The game log: faults, ctx.log lines and closes. The newest rides on the folded bar while a Match runs. */
      .sheet .bar-log, .log { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sheet .bar-log { grid-column: 1 / -1; margin-top: -6px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .log { list-style: none; margin: 0; padding: 8px 10px; display: grid; gap: 4px; max-height: 10.5em; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
      .log li { display: grid; grid-template-columns: 6ch 1fr; gap: 8px; }
      .log .log-kind { color: var(--fg-2); }
      .log .log-text { overflow-wrap: anywhere; }
      .log .log-fault .log-kind, .sheet .bar-log.log-fault { color: var(--wait); }

      /* Peer: one slim strip at the top. */
      .strip { position: fixed; top: 0; left: 0; right: 0; display: grid; grid-template-columns: auto 1fr auto; column-gap: 12px; align-items: baseline; padding: calc(10px + env(safe-area-inset-top, 0)) 14px 14px; background: linear-gradient(var(--bg) 55%, transparent); pointer-events: none; }
      .strip .brand { grid-row: 1; grid-column: 1; }
      .strip .code { grid-row: 2; grid-column: 1; font-size: 13px; color: var(--fg-2); }
      .strip .state { grid-row: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .strip .meta { grid-row: 2; grid-column: 2; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .strip .export { grid-row: 1 / span 2; grid-column: 3; align-self: start; pointer-events: auto; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--fg-2); font-size: 12px; }

      /* How the last Match closed (its result, or why it stopped), over the lobby on every phone that ran it: the first phone's with Play again and Change game, the others' until tapped; and a running Match's notice (a pause, or the Host's own view stopped), which touches pass through. */
      .result, .pause { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(84vw, 340px); padding: 22px 20px 16px; background: var(--raise); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55); text-align: center; }
      .result.closes { cursor: pointer; }
      .pause { padding-bottom: 20px; pointer-events: none; }
      .result p, .pause p { margin: 0; }
      .result .result-head, .pause .pause-head { font-size: 26px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
      .result .result-detail, .pause .pause-detail { margin-top: 8px; color: var(--fg-2); font-size: 16px; }
      .result .result-hint { margin-top: 14px; color: var(--fg-2); font-size: 12px; }
      .result .result-next { margin-top: 14px; font-size: 16px; }
      .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
      .result-actions button { min-height: 44px; border-radius: 8px; font-weight: 600; }
      .result-actions .again { background: var(--ok); color: var(--bg); }
      .result-actions .change { border: 1px solid var(--line); }
      .result .result-refusal { margin-top: 10px; color: var(--wait); }
      .result .result-refusal:empty { display: none; }
      /* The install offer (install.ts): under the result card's buttons, and as a row of the first phone's sheet. What, why, then the Install button or the steps. */
      .offer { display: grid; gap: 4px; }
      .offer p, .offer ol { margin: 0; }
      .offer .offer-head { font-size: 16px; font-weight: 600; }
      .offer .offer-reason { color: var(--fg-2); }
      .offer .offer-install { min-height: 44px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; }
      .offer .offer-steps { margin-top: 6px; padding-left: 1.4em; display: grid; gap: 4px; font-size: 16px; text-align: left; }
      .result .offer { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
      .result .offer-steps { justify-self: center; }
      .install-row { padding-top: 12px; border-top: 1px solid var(--line); }

      /* A Peer not in its table after 15 s: what to check, Try again, and its code to correct (join.ts). Inputs at 16 px: an iPhone does not zoom on focus. */
      .help { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(88vw, 360px); display: grid; gap: 14px; padding: 20px; background: var(--raise); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55); }
      .help p, .help ul { margin: 0; }
      .help .help-head { font-size: 20px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
      .help ul { padding-left: 1.2em; display: grid; gap: 8px; color: var(--fg-2); font-size: 16px; }
      .help .help-retry { min-height: 44px; border-radius: 8px; font-weight: 600; background: var(--ok); color: var(--bg); }
      .help form { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .help input { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; letter-spacing: 0.18em; text-transform: uppercase; }
      .help form button { min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; font-weight: 600; }
      /* The first phone: one phone keeps losing its connection, and what usually helps. It heads the sheet, above its bar, folded or open. */
      .sheet .advice { flex: none; margin: 0; padding: 12px 16px; border-bottom: 2px solid var(--wait); }
      /* Inside another app's browser (install.ts): open the page in Safari or Chrome. It heads the first phone's sheet, above the advice and the bar; on the other phones it is the strip's third line. */
      .inapp { margin: 0; padding: 12px 16px; background: var(--raise); border-bottom: 2px solid var(--wait); }
      .inapp b { display: block; font-weight: 600; }
      .sheet .inapp { flex: none; }
      .strip .inapp { grid-row: 3; grid-column: 1 / -1; margin: 10px -14px 0; color: var(--fg-2); }
      .strip .inapp b { color: var(--fg); }

      @media (prefers-reduced-motion: reduce) { .sheet, .seg button, .card, .chip, .move { transition: none; } .splash-dot { animation: none; } }
      /* Phones are used upright: the Layout is measured in portrait. A touch screen turned sideways is asked back; a desktop window is left alone. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; place-items: center; background: var(--bg); text-align: center; padding: 24px; }
      #rotate p { margin: 0; font-size: 20px; color: var(--fg-2); }
      @media (pointer: coarse) and (orientation: landscape) { #rotate { display: grid; } }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="game" hidden></div>
    <!-- Until the script opens the HUD (it replaces this section's content and class): the name, the pitch and a sign of life. The build fills in brand.json. -->
    <section id="hud" class="splash" aria-live="polite">
      <h1 class="splash-name">%BRAND_NAME%</h1>
      <p class="splash-pitch">%BRAND_PITCH%</p>
      <span class="splash-dot" aria-hidden="true"></span>
    </section>
    <div id="rotate" role="status"><p>Turn your phone upright</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
